name: Build setup checks

on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - config/**
      - manifests/**
      - tests/**
      - .github/workflows/checks.yml
  pull_request:
    paths:
      - scripts/**
      - config/**
      - manifests/**
      - tests/**
      - .github/workflows/checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test lock validation and workspace safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Validate pinned configuration
        run: python3 scripts/lune.py validate
      - name: Fetch permanent component inputs
        run: git -c fetch.prune=false fetch --no-prune --no-tags origin 'refs/tags/inputs/*:refs/tags/inputs/*'
      - name: Verify upstream ancestry and platform gitlink
        run: python3 scripts/lune.py validate --git-objects
      - name: Reconstruct platform and core from GitHub
        run: python3 scripts/lune.py checkout --arch arm64
