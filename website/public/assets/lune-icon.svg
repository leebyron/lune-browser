<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Lune — Pelagic Signal</title>
  <desc>Paired geometric lunes from Lune / Color Atlas. Pelagic Signal: deep blue, living cyan, blue.</desc>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#10354F"/>
  <g transform="translate(152 152) scale(2.4)">
    <defs>
      <mask id="left"><rect width="300" height="300" fill="black"/><circle cx="136" cy="150" r="111" fill="white"/><circle cx="164" cy="150" r="111" fill="black"/></mask>
      <mask id="right"><rect width="300" height="300" fill="black"/><circle cx="164" cy="150" r="111" fill="white"/><circle cx="136" cy="150" r="111" fill="black"/></mask>
    </defs>
    <rect width="300" height="300" fill="#00A7BE" mask="url(#left)"/>
    <rect width="300" height="300" fill="#5386BF" mask="url(#right)"/>
  </g>
</svg>
